name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write

# Newer pushes to a PR cancel older runs. Runs on main always finish, since they save the baseline.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  unit:
    name: unit (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm test

  # Runs the action the way users do: save a baseline on main, compare on PRs, comment on the PR.
  e2e:
    runs-on: ubuntu-latest
    env:
      DELAY_MS: 20
      ERROR_RATE: 0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: grafana/setup-k6-action@v1

      - name: Start demo server
        run: |
          node examples/demo-server.js &
          for i in $(seq 1 20); do curl -sf http://localhost:3333/ >/dev/null && break; sleep 0.5; done

      - name: Run load test
        continue-on-error: true
        # The test's handleSummary() writes summary.json.
        run: k6 run --quiet examples/load-test.js
        env:
          DURATION: 15s

      - name: p95 Guard
        uses: ./
        with:
          summary: summary.json

  # Proves on every push, with a real load test, that a real slowdown fails and an unchanged run passes.
  # Uses the "baseline" input, so it doesn't touch the cache or post comments.
  regression-detection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: grafana/setup-k6-action@v1

      - name: Record a fast and a slow run
        run: |
          record() { # <name> <delay ms>
            DELAY_MS=$2 node examples/demo-server.js & pid=$!
            for i in $(seq 1 20); do curl -sf http://localhost:3333/ >/dev/null && break; sleep 0.5; done
            # Write both summary formats from the same run.
            DURATION=10s SUMMARY_FILE=$1.json k6 run --quiet --summary-export=$1.export.json examples/load-test.js
            kill $pid; wait $pid 2>/dev/null || true
          }
          record fast 20
          record slow 60

      - name: Guard a slowdown (expected to fail)
        id: slow
        uses: ./
        with:
          name: self-test-slowdown
          mode: compare
          summary: slow.json
          baseline: fast.json
          comment: false
          fail-on-regression: false

      - name: Guard the same run in both formats (expected to pass)
        id: same
        uses: ./
        with:
          name: self-test-formats
          mode: compare
          summary: fast.export.json
          baseline: fast.json
          comment: false
          fail-on-regression: false

      - name: Start a stand-in Pro API
        run: |
          EXPECTED_KEY=ci-test-key LOG=pro-requests.jsonl node test/support/mock-pro-api.js &
          for i in $(seq 1 20); do curl -s http://127.0.0.1:8788/ >/dev/null && break; sleep 0.3; done

      - name: Guard with an API key (uploads to the stand-in)
        id: upload
        uses: ./
        with:
          name: self-test-upload
          mode: compare
          summary: fast.json
          baseline: fast.json
          comment: false
          api-key: ci-test-key
          api-url: http://127.0.0.1:8788

      - name: Check verdicts
        env:
          SLOW: ${{ steps.slow.outputs.verdict }}
          SLOW_REGRESSIONS: ${{ steps.slow.outputs.regressions }}
          SLOW_BASELINE: ${{ steps.slow.outputs.baseline-found }}
          SAME: ${{ steps.same.outputs.verdict }}
          REPORT: ${{ steps.slow.outputs.report }}
          UPLOADED: ${{ steps.upload.outputs.uploaded }}
          SLOW_UPLOADED: ${{ steps.slow.outputs.uploaded }}
        run: |
          echo "slowdown: $SLOW ($SLOW_REGRESSIONS regressions, baseline found: $SLOW_BASELINE)"
          echo "same run, two formats: $SAME"
          test "$SLOW" = fail
          test "$SLOW_BASELINE" = true
          test "$SLOW_REGRESSIONS" -gt 0
          test "$SAME" = pass
          grep -q '<!-- p95guard:self-test-slowdown -->' "$REPORT"
          echo "uploaded with key: $UPLOADED, without key: $SLOW_UPLOADED"
          test "$UPLOADED" = true
          test "$SLOW_UPLOADED" = false
          node -e '
            const runs = require("fs").readFileSync("pro-requests.jsonl", "utf8").trim().split("\n").map(JSON.parse).filter((r) => r.method === "POST");
            if (runs.length !== 1) throw new Error(`expected 1 upload, got ${runs.length}`);
            const b = runs[0].body;
            if (b.repo !== process.env.GITHUB_REPOSITORY || b.test !== "self-test-upload" || b.verdict !== "pass" || !(b.points.length > 0)) throw new Error(JSON.stringify(b));
            console.log(`upload ok: ${b.points.length} numbers for ${b.repo}@${b.sha.slice(0, 7)} on ${b.branch}`);
          '
