name: Bug report
description: Something went wrong or the report looks wrong
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: p95 Guard version
      placeholder: "v0.2.0 (or the @ref in your workflow)"
    validations:
      required: true
  - type: input
    id: tool
    attributes:
      label: Load testing tool and version
      description: The output of your load testing tool's version command
      placeholder: e.g. v1.3.0
    validations:
      required: true
  - type: dropdown
    id: format
    attributes:
      label: How do you write the summary?
      options:
        - "--summary-export"
        - "handleSummary()"
        - Not sure
  - type: textarea
    id: workflow
    attributes:
      label: Workflow
      description: The load test and p95 Guard steps from your workflow file.
      render: yaml
  - type: textarea
    id: logs
    attributes:
      label: Logs or report
      description: The p95 Guard step log, or the PR comment. Remove anything private.
      render: text
