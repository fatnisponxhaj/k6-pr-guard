# Copy to .github/workflows/performance.yml in your repo.
name: Performance

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  pull-requests: write # to post the PR comment

jobs:
  load-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # Start the service you want to test here (docker compose up -d, npm start &, ...).

      # Run your load test here so it writes its JSON summary to summary.json.
      # Give that step `continue-on-error: true`, so the guard can still report
      # when the test's own thresholds fail.

      - uses: fatnisponxhaj/p95guard@v0
        with:
          summary: summary.json
          p95-budget: 10
          error-rate-budget: 1
