name: p95 Guard
description: Catch performance regressions in PRs. Compares load test results with the last good run and posts a pass/fail comment.
branding:
  icon: activity
  color: purple

inputs:
  summary:
    description: Path to the JSON summary of the load test (from --summary-export or handleSummary).
    default: summary.json
  name:
    description: >
      Test name, when one repo runs several load tests (e.g. "api", "checkout").
      Each name gets its own baseline and its own PR comment. Letters, digits, ".", "_" and "-".
    default: ''
  metrics:
    description: >
      Trend metrics to compare, separated by commas or new lines. Tagged sub-metrics
      (per scenario) are included automatically.
    default: http_req_duration
  baseline:
    description: >
      Path to a baseline summary file to compare with, instead of the last good run from the cache.
      Use it for a baseline you keep in the repo or download yourself.
    default: ''
  mode:
    description: >
      "auto" saves a baseline on pushes to the default branch and compares everywhere else
      (always compares when "baseline" is set). Or force "compare" or "save-baseline".
    default: auto
  p95-budget:
    description: Max p(95) latency increase, in percent.
    default: '10'
  p99-budget:
    description: Max p(99) latency increase, in percent.
    default: '15'
  min-delta-ms:
    description: Latency changes smaller than this many milliseconds are ignored as noise.
    default: '5'
  error-rate-budget:
    description: Max http_req_failed increase, in percentage points.
    default: '1'
  checks-budget:
    description: Max drop of the checks pass rate, in percentage points.
    default: '1'
  ignore-thresholds:
    description: Set to "true" to not fail when the load test's own thresholds failed.
    default: 'false'
  fail-on-regression:
    description: Set to "false" to only report, never fail the job.
    default: 'true'
  comment:
    description: Post (and keep updating) a PR comment with the report.
    default: 'true'
  cache-key-prefix:
    description: Cache key prefix for the stored baseline. Prefer "name" to separate several tests.
    default: p95guard-baseline
  github-token:
    description: Token used to post the PR comment. Needs pull-requests write permission.
    default: ${{ github.token }}

outputs:
  verdict:
    description: '"pass" or "fail".'
    value: ${{ steps.compare.outputs.verdict || steps.check.outputs.verdict }}
  baseline-found:
    description: '"true" when there was a baseline to compare with.'
    value: ${{ steps.compare.outputs.baseline-found || steps.check.outputs.baseline-found }}
  regressions:
    description: Number of numbers (stat per metric) that got worse than the budget allows.
    value: ${{ steps.compare.outputs.regressions || steps.check.outputs.regressions }}
  report:
    description: Path to the Markdown report, e.g. to send it to Slack or Teams yourself.
    value: ${{ steps.compare.outputs.report || steps.check.outputs.report }}
  mode:
    description: '"compare" or "save-baseline", after resolving "auto".'
    value: ${{ steps.mode.outputs.mode }}

runs:
  using: composite
  steps:
    - id: mode
      shell: bash
      env:
        MODE: ${{ inputs.mode }}
        NAME: ${{ inputs.name }}
        BASELINE: ${{ inputs.baseline }}
        PREFIX: ${{ inputs.cache-key-prefix }}
        EVENT: ${{ github.event_name }}
        REF: ${{ github.ref }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      run: |
        if [ -n "$NAME" ] && ! [[ "$NAME" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
          echo "::error::p95guard: name may only use letters, digits, '.', '_' and '-' (got '$NAME')"
          exit 2
        fi
        mode="$MODE"
        if [ "$mode" = auto ]; then
          if [ -n "$BASELINE" ] || [[ "$EVENT" == pull_request* ]]; then mode=compare
          elif [ "$REF" = "refs/heads/$DEFAULT_BRANCH" ]; then mode=save-baseline
          else mode=compare; fi
        fi
        case "$mode" in compare|save-baseline) ;; *)
          echo "::error::p95guard: mode must be auto, compare or save-baseline (got '$MODE')"
          exit 2 ;;
        esac
        # The cache path is part of the cache version, so different names can never restore each other's
        # baseline, even when one key prefix matches another ("api-" also matches "api-v2-...").
        if [ -n "$NAME" ]; then
          path=".p95guard/$NAME/baseline.json"; key="$PREFIX-$NAME"
        else
          path=".p95guard/baseline.json"; key="$PREFIX"
        fi
        echo "p95guard mode: $mode${NAME:+ (name: $NAME)}"
        { echo "mode=$mode"; echo "path=$path"; echo "key=$key"; } >> "$GITHUB_OUTPUT"

    # Caches saved on the default branch can be restored from pull requests.
    # Prefer the exact commit the PR is based on, else the newest baseline.
    - id: restore
      if: steps.mode.outputs.mode == 'compare' && inputs.baseline == ''
      uses: actions/cache/restore@v6
      with:
        path: ${{ steps.mode.outputs.path }}
        key: ${{ steps.mode.outputs.key }}-${{ github.event.pull_request.base.sha || github.sha }}
        restore-keys: ${{ steps.mode.outputs.key }}-

    - id: compare
      if: steps.mode.outputs.mode == 'compare'
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        SUMMARY: ${{ inputs.summary }}
        NAME: ${{ inputs.name }}
        METRICS: ${{ inputs.metrics }}
        BASELINE_INPUT: ${{ inputs.baseline }}
        CACHE_PATH: ${{ steps.mode.outputs.path }}
        MATCHED_KEY: ${{ steps.restore.outputs.cache-matched-key }}
        DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        P95: ${{ inputs.p95-budget }}
        P99: ${{ inputs.p99-budget }}
        MIN_DELTA: ${{ inputs.min-delta-ms }}
        ERRORS: ${{ inputs.error-rate-budget }}
        CHECKS: ${{ inputs.checks-budget }}
        IGNORE_THRESHOLDS: ${{ inputs.ignore-thresholds }}
        FAIL: ${{ inputs.fail-on-regression }}
        COMMENT: ${{ inputs.comment }}
      run: |
        if [ -n "$BASELINE_INPUT" ]; then
          baseline="$BASELINE_INPUT"; label="\`$BASELINE_INPUT\`"
        else
          baseline="$CACHE_PATH"
          sha="${MATCHED_KEY##*-}"
          label="the last good run on \`${DEFAULT_BRANCH:-the default branch}\`${MATCHED_KEY:+ (${sha:0:7})}"
        fi
        args=(--current "$SUMMARY" --baseline "$baseline" --baseline-label "$label"
              --p95 "$P95" --p99 "$P99" --min-delta-ms "$MIN_DELTA"
              --error-rate "$ERRORS" --checks "$CHECKS"
              --markdown "$RUNNER_TEMP/p95guard${NAME:+-$NAME}.md" --quiet)
        for m in ${METRICS//,/ }; do args+=(--metric "$m"); done
        [ -n "$NAME" ] && args+=(--name "$NAME")
        [ "$IGNORE_THRESHOLDS" = true ] && args+=(--ignore-thresholds)
        [ "$COMMENT" = true ] && args+=(--comment)
        [ "$FAIL" = true ] || args+=(--warn-only)
        node "$GITHUB_ACTION_PATH/src/cli.js" "${args[@]}"

    # Only a run that passes its own thresholds becomes the new baseline ("last good run").
    - id: check
      if: steps.mode.outputs.mode == 'save-baseline'
      shell: bash
      env:
        SUMMARY: ${{ inputs.summary }}
        NAME: ${{ inputs.name }}
        METRICS: ${{ inputs.metrics }}
        CACHE_PATH: ${{ steps.mode.outputs.path }}
        IGNORE_THRESHOLDS: ${{ inputs.ignore-thresholds }}
      run: |
        args=(--current "$SUMMARY" --saving-baseline --quiet
              --markdown "$RUNNER_TEMP/p95guard${NAME:+-$NAME}.md")
        for m in ${METRICS//,/ }; do args+=(--metric "$m"); done
        [ -n "$NAME" ] && args+=(--name "$NAME")
        [ "$IGNORE_THRESHOLDS" = true ] && args+=(--ignore-thresholds)
        set +e
        node "$GITHUB_ACTION_PATH/src/cli.js" "${args[@]}"
        code=$?
        set -e
        if [ "$code" -eq 0 ]; then
          mkdir -p "$(dirname "$CACHE_PATH")" && cp "$SUMMARY" "$CACHE_PATH"
          echo "This run becomes the new baseline."
        elif [ "$code" -eq 1 ]; then
          echo "::warning::The load test did not pass, so it was not saved as the baseline."
        else
          exit "$code"
        fi

    - if: steps.mode.outputs.mode == 'save-baseline' && steps.check.outputs.verdict == 'pass'
      uses: actions/cache/save@v6
      with:
        path: ${{ steps.mode.outputs.path }}
        key: ${{ steps.mode.outputs.key }}-${{ github.sha }}
